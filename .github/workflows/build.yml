      - name: Extract ZIP archive
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Using ZIP file: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          SUBDIR=$(find extracted -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          test -n "$SUBDIR"
          cp -a "$SUBDIR"/. .
          
          
