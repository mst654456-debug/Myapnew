name: Build Samalut APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP archive
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Using ZIP file: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          SUBDIR=$(find extracted -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          test -n "$SUBDIR"
          cp -a "$SUBDIR"/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx3g"
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          [ -f .env.example ] && cp .env.example .env || true

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samalut-Education-APK
          path: app/build/outputs/apk/debug/*.apk
          
          
          
